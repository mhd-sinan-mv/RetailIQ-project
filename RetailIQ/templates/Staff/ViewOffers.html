<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Offer Product</th>
            <th>Offer Name</th>
            <th>Description</th>
            <th>Offer Type</th>
            <th>Time Period</th>
            <th>Status</th>
        </tr>
        {% for i in offer_data %}
        <tr>
            <td>{{ i. }}</td>
            <td>{{ i.offer_name }}</td>
            <td>{{ i.offer_description }}</td>
            <td>{{ i.offer_type }}</td>
            <td>{{ i.offer_start_date }} to {{ i.offer_end_date }}</td>
            <td>{{ i.is_active }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
