<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Product</th>
            <th>Discount Type</th>
            <th>Dicount Value</th>
            <th>Time Period</th>
        </tr>
        {% for i in discount_data %}
        <tr>
            <td>Name : {{ i.product_id.product_name }}<br> Brand : {{ i.product_id.brand }}</td>
            <td>{{ i.discount_type }}</td>
            <td>{{ i.discount_value }}</td>
            <td>{{ i.start_date }} to {{ i.end_date }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
