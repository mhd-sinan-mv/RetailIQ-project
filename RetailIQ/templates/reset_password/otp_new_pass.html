
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | RetailIQ</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f1f5f9;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 16px;
            border: 1px solid #e8edf3;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 55px;
            height: 55px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ecfdf5;
            color: #059669;
            border-radius: 14px;
            font-size: 24px;
        }

        .brand h1 {
            font-size: 25px;
            font-weight: 800;
            color: #172033;
        }

        .brand h1 span {
            color: #059669;
        }

        .brand p {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 7px;
        }

        .heading {
            text-align: center;
            margin-bottom: 27px;
        }

        .heading h2 {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 9px;
        }

        .heading p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 9px;
        }

        .input-box {
            position: relative;
        }

        .input-box > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 42px 13px 42px;
            border: 1px solid #dce3eb;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: 13px;
            color: #334155;
            transition: 0.2s;
        }

        input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        input::placeholder {
            color: #b0bac8;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #047857;
            transform: translateY(-1px);
        }

        .submit-btn i {
            margin-right: 8px;
        }

        .back-login {
            text-align: center;
            margin-top: 23px;
        }

        .back-login a {
            color: #059669;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #94a3b8;
            font-size: 10px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-chart-line"></i>
        </div>

        <h1>Retail<span>IQ</span></h1>
        <p>Smart Retail Management Platform</p>
    </div>

    <div class="heading">
        <h2>Reset Your Password</h2>
        <p>Verify your OTP and create a new password for your account.</p>
    </div>

    <form method="post" id="resetForm">
        {% csrf_token %}

        <div class="form-group">
            <label>Verification OTP</label>

            <div class="input-box">
                <i class="fa-solid fa-shield-halved"></i>
                <input
                    type="text"
                    name="OTP"
                    placeholder="Enter your OTP"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label>New Password</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="newPassword"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >
                <button type="button" class="toggle-password"
                    onclick="togglePassword('newPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="confirmPassword"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >
                <button type="button" class="toggle-password"
                    onclick="togglePassword('confirmPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="submit-btn">
            <i class="fa-solid fa-key"></i>
            Reset Password
        </button>

    </form>

    <div class="back-login">
        <a href="/">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>
    </div>

    <div class="footer">
        © 2026 RetailIQ. All rights reserved.
    </div>

</div>

<script>
    function togglePassword(id, button) {
        const input = document.getElementById(id);
        const icon = button.querySelector('i');

        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    document.getElementById('resetForm').addEventListener('submit', function(e) {
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Passwords do not match. Please try again.');
        }
    });
</script>

</body>
</html>
