<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Shop name</th>
            <th>email</th>
            <th>phone</th>
            <th>date joined</th>
            <th></th>
        </tr>
        {% for i in shop_data %}
        <tr>
            <td>{{ i.shop_name }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.phone }}</td>
            <td>{{ i.date_joined }}</td>
            <td>
                {% if i.LOGINID.user_type == 'shopToAccept' %}
                    <a href="acceptShop/{{i.LOGINID.id}}"><button>accept</button></a>
                    <a href="rejectShop/{{i.LOGINID.id}}"><button>reject</button></a>
                    
                {% elif i.LOGINID.user_type == 'shopRejected' %}
                    <a href="acceptShop/{{i.LOGINID.id}}"><button>accept</button></a>
                {% else %}
                    <a href="rejectShop/{{i.LOGINID.id}}"><button>reject</button></a>
                {% endif %}
                    
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
