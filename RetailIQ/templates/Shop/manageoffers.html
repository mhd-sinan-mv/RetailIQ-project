<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <table border="1">
        <tr>
            <th>Offer Name</th>
            <!-- <th>Product id/Applied products</th> now its implementing as an offer available for shop not for individual products -->
            <th>Offer Type</th>
            <th>Description</th>
            <th>Offer Period</th>
            <th>action</th>
        </tr>
        {% for i in offer_data %}
        <tr>
            <td>{{ i.offer_name }}</td>
            <!-- <td>{{ i.PRODUCT.product_name }}</td> -->
            <td>{{ i.offer_type }}</td>
            <td>{{ i.offer_description }}</td>
            <td>{{ i.offer_start_date }} to {{ i.offer_end_date }}</td>
            <td>
                <button type="submit">Edit/Delete</button>
            </td>
        </tr>
        {% endfor %}
      </table>
      <br>
        <form method="post">
            {% csrf_token %}
            <label>Offer name</label>
            <input type="text" name="offer_name" required> <br>
            <label>Offer Type</label>
            <input type="text" name="offer_type"> <br>
            <label>Description</label>
            <input type="text" name="offer_description" > <br>
            <label>Offer Period</label>
            <input type="date" name="offer_start_date" required> to <input type="date" name="offer_end_date" required>  <br>
            <button type="submit">submit</button>
        </form>
</body>
</html>
