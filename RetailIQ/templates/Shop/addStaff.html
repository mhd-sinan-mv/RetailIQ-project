
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff | RetailIQ</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1e293b;
            padding: 35px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 25px;
            font-weight: 700;
            color: #142238;
        }

        .page-header p {
            color: #64748b;
            font-size: 13px;
            margin-top: 7px;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 11px 17px;
            border-radius: 9px;
            color: #151617;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #047857;
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(5, 150, 105, 0.15);
        }

        .card {
            background: white;
            border-radius: 13px;
            padding: 30px;
            border: 1px solid #e9edf3;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.035);
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #edf0f4;
        }

        .heading-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #ecfdf5;
            color: #059669;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .card-heading h2 {
            font-size: 17px;
            font-weight: 700;
            color: #17243a;
        }

        .card-heading p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 21px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }

        .required {
            color: #ef4444;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #dce3ec;
            border-radius: 7px;
            outline: none;
            background: #fff;
            font-size: 13px;
            color: #334155;
            transition: 0.2s;
        }

        input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        input::placeholder {
            color: #b0bac8;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 42px;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #edf0f4;
        }

        .submit-btn {
            padding: 12px 22px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #047857;
        }

        .submit-btn i {
            margin-right: 7px;
        }

        @media(max-width: 650px) {
            body {
                padding: 18px;
            }

            .card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .page-header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="page-header">
        <div>
            <h1>Add Staff</h1>
            <p>Register a new staff member and assign their counter.</p>
        </div>

        <a href="shop_home" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </div>

    <div class="card">

        <div class="card-heading">
            <div class="heading-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <div>
                <h2>Staff Information</h2>
                <p>Enter the staff member's details below.</p>
            </div>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label>Name <span class="required">*</span></label>
                    <input type="text"
                           name="name"
                           placeholder="Enter full name"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label>Phone <span class="required">*</span></label>
                    <input type="tel"
                           name="phone"
                           placeholder="Enter phone number"
                           required>
                </div>

                <div class="form-group">
                    <label>Designation <span class="required">*</span></label>
                    <input type="text"
                           name="designation"
                           placeholder="e.g. Cashier, Manager"
                           required>
                </div>

                <div class="form-group">
                    <label>Assigned Counter</label>
                    <input type="number"
                           name="assigned_counter"
                           placeholder="Enter counter number"
                           min="1">
                </div>

                <div class="form-group">
                    <label>Staff Code <span class="required">*</span></label>
                    <input type="text"
                           name="staff_code"
                           placeholder="Enter unique staff code"
                           required>
                </div>

                <div class="form-group full">
                    <label>Assigned Password <span class="required">*</span></label>

                    <div class="password-wrapper">
                        <input type="password"
                               name="assigned_password"
                               id="assigned_password"
                               placeholder="Create initial password"
                               required>

                        <i class="fa-solid fa-eye toggle-password"
                           onclick="togglePassword()"
                           id="passwordIcon"></i>
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-user-plus"></i>
                    Add Staff
                </button>
            </div>

        </form>

    </div>

</div>

<script>
    function togglePassword() {
        const password = document.getElementById("assigned_password");
        const icon = document.getElementById("passwordIcon");

        if (password.type === "password") {
            password.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            password.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
