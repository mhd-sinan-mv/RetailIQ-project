<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Registration</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <td><label>Shop Name :</label></td>
                <td><input type="text" name="shop_name" placeholder="enter shop name"></td>
            </tr>
            <tr>
                <td><label>Email :</label></td>
                <td><input type="email" name="email" placeholder="enter your email"></td>
            </tr>
            <tr>
                <td><label>Phone :</label></td>
                <td><input type="tel" name="phone" placeholder="enter your number"></td>
            </tr>
            <tr>
                <td><label>Password :</label></td>
                <td><input type="password" name="password" placeholder="enter your password"></td>
            </tr>
            <tr>
                <td><label>Confirm Password :</label></td>
                <td><input type="password" name="confirmPassword" placeholder="confirm your password"></td>
            </tr>
            <tr>
                <td>
                    <button type="submit">Register</button>
                </td>
            </tr>
        </table>
    </form>
    Already a user ? <a href="{% url 'LoginPage' %}">Login</a>

</body>
</html>
