<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title> 
</head>
<body>
    <table border="1">
        <tr>
            <th>Date</th>
            <th>Title</th>
            <th>Message</th>
            <th>Product related</th>
        </tr>
        {% for i in notification_data %}
        <tr>
            <td>{{ i.notification_date }}</td>
            <td>{{ i.notification_title }}</td>
            <td>{{ i.notification_message }}</td>
            <td>{{ i.product_id.product_name }}</td>
        </tr>
        {% endfor %}
    </table>
