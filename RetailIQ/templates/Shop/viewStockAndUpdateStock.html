<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Product name</th>
            <th>Brand</th>
            <th>Quantity</th>
            <th>Category</th>
            <th>Last updated</th>
            <th>status</th>
            <th>Action</th>
        </tr>
        {% for i in stock_data %}
        <tr>
            <td>{{ i.product_name }}</td>
            <td>{{ i.brand }}</td>
            <td>{{ i.STOCK.quantity }}</td>
            <td>{{ i.CATEGORY.category_name }}</td>
            <td>{{ i.STOCK.last_updated }}</td>
            <td>{{ i.STOCK.status }}</td>
            <td><button>Add stock</button> <br> <button>Remove</button></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
