
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shop Profile | RetailIQ</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            min-height: 100vh;
        }

        .main {
            max-width: 1000px;
            margin: auto;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .page-title h2 {
            font-size: 25px;
            font-weight: 700;
            color: #172033;
        }

        .page-title p {
            font-size: 13px;
            color: #64748b;
            margin-top: 7px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: white;
            color: #334155;
            border: 1px solid #e2e8f0;
            padding: 11px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: #047857;
            color: white;
            border-color: #047857;
        }

        .form-card {
            background: white;
            border: 1px solid #e8edf3;
            border-radius: 13px;
            padding: 30px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.03);
        }

        .card-header {
            padding-bottom: 22px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 28px;
        }

        .card-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #172033;
        }

        .card-header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 7px;
        }

        .form-group {
            margin-bottom: 23px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px 13px 43px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: #334155;
            background: #fff;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.10);
        }

        .form-group input::placeholder {
            color: #a0aaba;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding-top: 22px;
            border-top: 1px solid #f1f5f9;
            margin-top: 10px;
        }

        .cancel-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border: 1px solid #e2e8f0;
            background: white;
            color: #475569;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

        .cancel-btn:hover {
            background: #f8fafc;
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 12px 22px;
            border: none;
            background: #059669;
            color: white;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #047857;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .main {
                padding: 22px 15px;
            }

            .topbar {
                align-items: flex-start;
            }

            .page-title h2 {
                font-size: 21px;
            }

            .form-card {
                padding: 22px 18px;
            }

            .form-footer {
                flex-direction: column-reverse;
            }

            .cancel-btn,
            .submit-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="main">

    <div class="topbar">
        <div class="page-title">
            <h2>Edit Shop Profile</h2>
            <p>Update your shop name and registered contact information.</p>
        </div>

        <a href="/shopProfile" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Profile
        </a>
    </div>

    <div class="form-card">

        <div class="card-header">
            <h3>
                <i class="fa-solid fa-store" style="color:#059669; margin-right:8px;"></i>
                Shop Information
            </h3>
            <p>Make changes to your registered shop details below.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Shop Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-store"></i>
                    <input
                        type="text"
                        name="shop_name"
                        value="{{ shop_edit_data.shop_name }}"
                        placeholder="Enter shop name"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        name="email"
                        value="{{ shop_edit_data.email }}"
                        placeholder="Enter email address"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input
                        type="tel"
                        name="phone"
                        value="{{ shop_edit_data.phone }}"
                        placeholder="Enter phone number"
                        required>
                </div>
            </div>

            <div class="form-footer">
                <a href="/shopProfile" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-check"></i>
                    Save Changes
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
