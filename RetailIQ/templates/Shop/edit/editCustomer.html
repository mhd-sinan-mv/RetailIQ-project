<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
    <label>Customer Name :</label>
    <input type="text" name="name" value="{{cust.name}}"><br>
    <label>Email :</label>
    <input type="email" name="email" value="{{cust.email}}"><br>
    <label>Phone :</label>
    <input type="tel" name="phone" value="{{cust.phone}}"><br>
    <label>Address :</label>
    <input type="text" name="address" value="{{cust.address}}"><br>
    <button type="submit">Submit</button>
    </form>
</body>
</html>
