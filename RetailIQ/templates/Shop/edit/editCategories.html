<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
            <form method="post">
            {% csrf_token %}
            <h3>Add a category</h3>
            <label>Category name</label>
            <input value="{{editCategories.category_name}}" type="text" name="category_name" required>
            <br>
            <label>Description</label>
            <input value="{{editCategories.category_description}}" type="text" name="category_description">
            <br>
            <button type="submit"> Submit</button>
        </form>
</body>
</html>
