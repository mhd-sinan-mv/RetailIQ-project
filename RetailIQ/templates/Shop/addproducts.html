<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <td><label>Product Name</label></td>
                <td><input type="text" name="product_name"></td>
            </tr>
            <tr>
                <td><label>Brand</label></td>
                <td><input type="text" name="brand" ></td>
            </tr>
            <tr>
                <td><label>Quantity</label></td>
                <td><input type="number" name=""></td>
            </tr>
            <tr>
                <td><label>Purchase Price</label></td>
                <td><input type="number" name="purchase_price"></td>
            </tr>
            <tr>
                <td><label>Selling Price</label></td>
                <td><input type="number" name="selling_price"></td>
            </tr>
            <tr>
                <td><label>Category</label></td>
                <td><input type="text" name=""></td>
            </tr>
            <tr>
                <td><label >Unit</label></td>
                <td><input type="text" name="unit"></td>
            </tr>
            <tr>
                <td><label>Manufacturing Date</label></td>
                <td><input type="date"  name="manufacturing_date"></td>
            </tr>
            <tr>
                <td><label>Expiry Date</label></td>
                <td><input type="date"  name="expiry_date"></td>
            </tr>
            <tr>
                <td><label>Barcode</label></td>
                <td><input type="number"  name="barcode"></td>
            </tr>
            <tr>
                <td><label>Supplier Name</label></td>
                <td><input type="text"  name="supplier_name"></td>
            </tr>
            <tr>
                <td><label>Supplier Email</label></td>
                <td><input type="email"  name="supplier_email"></td>
            </tr>
            <tr>
                <td><label>Supplier Phone</label></td>
                <td><input type="tel"  name="supplier_phone"></td>
            </tr>
            <tr>
                <td><label>Description</label></td>
                <td><textarea  name="description" rows="3"></textarea></td>
            </tr>
        </table>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
